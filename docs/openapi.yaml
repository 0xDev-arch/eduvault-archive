openapi: "3.1.0"

info:
  title: EduVault API
  version: "1.0.0"
  description: |
    REST API for the EduVault decentralised learning-material marketplace.
    All write endpoints require a valid `auth_token` cookie issued by the
    `/api/auth` login flow (HS256 JWT signed with `JWT_SECRET`).

    Inbound webhooks and integration callbacks are verified cryptographically.
    Every delivery must carry a signature header and a timestamp. Requests
    with an invalid signature, a stale timestamp (outside the configured
    replay window), or an already-processed event ID are rejected with a
    structured error response.

servers:
  - url: "http://localhost:3000"
    description: Local development
  - url: "https://eduvault.vercel.app"
    description: Production (Vercel)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  parameters:
    WebhookSignature:
      name: X-EduVault-Signature
      in: header
      required: true
      description: |
        HMAC-SHA256 signature over the canonical string
        `<timestamp>.<raw_body>`, formatted as `v1=<hex_digest>`.
      schema:
        type: string
        pattern: '^v1=[0-9a-f]{64}$'
        example: "v1=9f2c4e1a7b3d5e6f7890a1b2c3d4e5f60718292a3b4c5d6e7f890a1b2c3d4e5f"
    WebhookTimestamp:
      name: X-EduVault-Timestamp
      in: header
      required: true
      description: |
        Unix epoch timestamp in seconds of when the delivery was signed.
        Requests whose timestamp is outside the configured replay window
        (default 300 seconds) are rejected as stale.
      schema:
        type: string
        pattern: '^[0-9]{1,10}$'
        example: "1700000000"
    WebhookEventId:
      name: X-EduVault-Event-Id
      in: header
      required: true
      description: |
        Stable identifier for the event. Processed event IDs are persisted
        so a duplicate delivery is acknowledged without repeating side effects.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: "evt_01HZW93A2B4C5D6E7F8G0"
    WebhookProvider:
      name: X-EduVault-Provider
      in: header
      required: false
      description: |
        Optional provider identifier (e.g. `payments`, `integrations`).
        Selects which signing secret is used to verify the delivery.
      schema:
        type: string
        pattern: '^[a-z0-9_-]{1,64}$'
        example: "payments"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
      required: [error]

    WebhookError:
      type: object
      description: |
        Structured error returned for webhook deliveries that fail verification.
        The `code` field is a stable machine-readable reason code.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable explanation.
        code:
          type: string
          enum:
            - invalid_signature
            - missing_signature
            - stale_timestamp
            - invalid_timestamp
            - duplicate_event
            - malformed_payload
          description: Stable machine-readable reason code.
        details:
          type: object
          additionalProperties: true
          description: Optional context (e.g. eventId, timestamp, skew, replayWindowSeconds).

    WebhookAcknowledgement:
      type: object
      required: [status, eventId]
      properties:
        status:
          type: string
          enum: [processed, duplicate]
          description: |
            `processed` when the event was handled for the first time.
            `duplicate` when the event ID was already recorded and no
            side effects were repeated.
        eventId:
          type: string
        receivedAt:
          type: string
          format: date-time

    Material:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
        userAddress:
          type: string
          description: Stellar public key of the uploader
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [title, price]

    MaterialInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
      required: [title, price]

    MaterialImportRecord:
      type: object
      required: [title, storageKey]
      properties:
        externalId:
          type: string
          maxLength: 128
          description: Stable id from the source system. Re-importing a row with the same externalId updates or skips instead of duplicating.
        title:
          type: string
        storageKey:
          type: string
        description:
          type: string
        shortSummary:
          type: string
        price:
          type: number
        visibility:
          type: string
          enum: [private, public, unlisted]
        category:
          type: string
        subject:
          type: string
        level:
          type: string
        usageRights:
          type: string
        coverImageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        learningOutcomes:
          type: array
          items:
            type: string
        tableOfContents:
          type: array
          items
            type: string
        sampleNotes:
          type: array
          items
            type: string

    ImportRowError:
      type: object
      required: [row, errors]
      properties:
        row:
          type: integer
          description: 1-based position in the submitted records array
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    ImportPlanRow:
      type: object
      required: [row, action]
      properties:
        row:
          type: integer
        action:
          type: string
          enum: [create, update, skip, error]
        externalId:
          type: [string, "null"]
        materialId:
          type: string
        fields:
          type: array
          description: Fields an update would change
          items:
            type: string
        reason:
          type: string
        errors:
          type: array
          items:
            type: object

    MaterialImportResponse:
      type: object
      required: [dryRun, total, valid, invalid, invalidRows, summary, rows]
      properties:
        dryRun:
          type: boolean
        total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        invalidRows:
          type: array
          items
            $ref: "#/components/schemas/ImportRowError"
        summary:
          type: object
          required: [create, update, skip, error]
          properties:
            create:
              type: integer
            update:
              type: integer
            skip:
              type: integer
            error:
              type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPlanRow"
        message:
          type: string

    MaterialImportCommitResponse:
      allOf:
        - $ref: "#/components/schemas/MaterialImportResponse"
        - type: object
          required: [importBatchId, imported, created, updated, failedRows, rollback]
          properties:
            importBatchId:
              type: string
            imported:
              type: integer
              description: created + updated
            created:
              type: integer
            updated:
              type: integer
            failedRows:
              type: array
              items:
                type: object
                required: [row, action, message]
                properties:
                  row:
                    type: integer
                  action:
                    type: string
                    enum: [create, update]
                  code:
                    type: integer
                  message:
                    type: string
            rollback:
              type: object
              required: [importBatchId, created, updated, retry]
              properties:
                importBatchId:
                  type: string
                created:
                  type: string
                updated:
                  type: string
                retry:
                  type: string

    Notification:
      type: object
      required: [id, type, severity, title, message, link, read, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [import_completed, import_partial_failure]
        severity:
          type: string
          enum: [success, error]
        title:
          type: string
        message:
          type: string
        link:
          type: [string, "null"]
          description: Internal app path to the related workflow
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer

    UserProfile:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        displayName:
          type: string
        bio:
          type: string
        institution:
          type: string
        country:
          type: string
        payoutWalletAddress:
          type: string
        preferredPayoutCurrency:
          type: string
        payoutNotes:
          type: string
        createdAt:
          type: string
          format: date-time

    Purchase:
      type: object
      properties:
        _id:
          type: string
        buyerAddress:
          type: string
        materialId:
          type: string
        userEmail:
          type: string
        status:
          type: string
          enum: [pending, confirmed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Entitlement:
      type: object
      properties:
        materialId:
          type: string
        grantedAt:
          type: string
          format: date-time

    IncidentInput:
      type: object
      description: Inputs for the incident impact calculator.
      required: [incidentId, window]
      properties:
        incidentId:
          type: string
          description: Stable identifier for the incident being assessed.
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        affectedUsers:
          type: array
          description: Wallet addresses of users believed to be affected.
          items:
            type: string
        affectedRecords:
          type: array
          description: Material ids believed to be affected.
          items:
            type: string
        affectedOperations:
          type: array
          description: Operation types that were disrupted.
          items
            type: string
            enum: [purchase, import, download, entitlement]
        severity:
          type: string
          enum: [low, medium, high, critical]
        redact:
          type: boolean
          default: true
          description: When true, return the shareable view with sensitive details redacted.

    IncidentImpactSummary:
      type: object
      required: [users, records, operations, severity]
      properties:
        users:
          type: integer
        records:
          type: integer
        operations:
          type: integer
        severity:
          type: string
          enum: [low, medium, high, critical]

    IncidentImpactResult:
      type: object
      required: [incidentId, window, summary, internal, shareable]
      properties:
        incidentId:
          type: string
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          $ref: "#/components/schemas/IncidentImpactSummary"
        internal:
          type: object
          description: Full detail for maintainers. Only included when redact is false.
          properties:
            affectedUsers:
              type: array
              items:
                type: string
            affectedRecords:
              type: array
              items:
                type: string
            affectedOperations:
              type: array
              items:
                type: string
        shareable:
          type: object
          description: Redacted view safe for external communication.
          required: [incidentId, window, summary]
          properties:
            incidentId:
              type: string
            window:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
            summary:
              $ref: "#/components/schemas/IncidentImpactSummary"
            note:
              type: string
              description: Human-readable explanation of the redaction.

    ReceiptPayload:
      type: object
      description: |
        Canonical, deterministic receipt payload. The `SKsGNATURE_VERSION` and
        `SIGNATURE_ALGORITHM` are constants so consumers can recreate the
        canonical bytes and verify the HMAC-SHA256 signature independently.
      required:
        - receiptId
        - operation
        - actor

paths:
  /api/webhooks/{provider}:
    post:
      operationId: receiveWebhook
      summary: Receive a signed integration webhook
      description: |
        Verifies the delivery signature (HMAC-SHA256 over `<timestamp>.<raw_body>`),
        enforces the replay window on the supplied timestamp, and deduplicates
        by persisting the event ID before running side effects.

        Error responses use the `WebhookError` schema with a stable `code`
        so callers can branch on the failure reason:
        - 401 `missing_signature` / `invalid_signature`
        - 400 `invalid_timestamp` / `malformed_payload` / `missing_event_id`
        - 408 `stale_timestamp`
        - 200 with `status: duplicate` for an already-processed event
      tags:
        - Webhooks
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider identifier used to select the signing secret.
          schema:
            type: string
            pattern: '^[a-z0-9_-]{1,64}$'
            example: "payments"
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              id: "evt_01HZW93A2B4C5D6E7F8G0"
              type: "payment.confirmed"
              data:
                purchaseId: "66f1a2b3c4d5e6f7890a1b2c"
                materialId: "66f1a2b3c4d5e6f7890a1b2d"
                buyerAddress: "GBADRESS4WN4YXWM3WXXYZ7ZWXYZ7ZWXYZ7ZWXYZ7ZWXYZ7ZWXYZ"
      responses:
        "200":
          description: Event accepted. @status is `processed` for a first delivery or `duplicate` when the event ID was already recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
        "400":
          description: Malformed payload or invalid timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              example:
                error: "Invalid timestamp header"
                code: "invalid_timestamp"
                details:
                  timestamp: "not-a-number"
        "401":
          description: Missing or invalid signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              example:
                error: "Signature verification failed"
                code: "invalid_signature"
                details:
                  skew: 0
        "408":
          description: Timestamp outside the configured replay window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              example:
                error: "Timestamp outside replay window"
                code: "stale_timestamp"
                details:
                  skew: 900
                  replayWindowSeconds: 300
        "422":
          description: Payload could not be parsed as JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              example:
                error: "Request body is not valid JSON"
                code: "malformed_payload"

openapi: "3.1.0"

info:
  title: EduVault API
  version: "1.0.0"
  description: |
    REST API for the EduVault decentralised learning-material marketplace.
    All write endpoints require a valid `auth_token` cookie issued by the
    `/api/auth` login flow (HS256 JWT signed with `JWT_SECRET`).

    Inbound webhooks and integration callbacks are verified with an HMAC-SHA256
    signature over the canonical `<timestamp>.<body>`
    payload and are rejected when the timestamp falls outside the configured
    replay window or when the event id has already been processed.

servers:
  - url: "http://localhost:3000"
    description: Local development
  - url: "https://eduvault.vercel.app"
    description: Production (Vercel)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
      required: [error]

    WebhookError:
      type: object
      description: |
        Structured error returned by the webhook endpoint. The `code` is a
        stable machine-readable value so clients can react without parsing
        the human-readable message.
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_signature
            - missing_signature
            - stale_timestamp
            - invalid_timestamp
            - duplicate_event
            - malformed_payload
            - unknown_provider
            - internal_error
        details:
          type: object
          additionalProperties: true

    WebhookAcknowledgement:
      type: object
      description: |
        Returned when an event is accepted. `duplicate` is true when the event
        was already processed and no side effects were repeated.
      required: [received, duplicate, eventId]
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
        eventId:
          type: string
        provider:
          type: string
        processedRecords:
          type: integer
          description: Number of records affected by this event (0 for duplicates).

    Material:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
        userAddress:
          type: string
          description: Stellar public key of the uploader
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [title, price]

    MaterialInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
      required: [title, price]

    MaterialImportRecord:
      type: object
      required: [title, storageKey]
      properties:
        externalId:
          type: string
          maxLength: 128
          description: Stable id from the source system. Re-importing a row with the same externalId updates or skips instead of duplicating.
        title:
          type: string
        storageKey:
          type: string
        description:
          type: string
        shortSummary:
          type: string
        price:
          type: number
        visibility:
          type: string
          enum: [private, public, unlisted]
        category:
          type: string
        subject:
          type: string
        level:
          type: string
        usageRights:
          type: string
        coverImageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        learningOutcomes:
          type: array
          items:
            type: string
        tableOfContents:
          type: array
          items:
            type: string
        sampleNotes:
          type: array
          items:
            type: string

    ImportRowError:
      type: object
      required: [row, errors]
      properties:
        row:
          type: integer
          description: 1-based position in the submitted records array
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    ImportPlanRow:
      type: object
      required: [row, action]
      properties:
        row:
          type: integer
        action:
          type: string
          enum: [create, update, skip, error]
        externalId:
          type: [string, "null"]
        materialId:
          type: string
        fields:
          type: array
          description: Fields an update would change
          items:
            type: string
        reason:
          type: string
        errors:
          type: array
          items:
            type: object

    MaterialImportResponse:
      type: object
      required: [dryRun, total, valid, invalid, invalidRows, summary, rows]
      properties:
        dryRun:
          type: boolean
        total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        invalidRows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
        summary:
          type: object
          required: [create, update, skip, error]
          properties:
            create:
              type: integer
            update:
              type: integer
            skip:
              type: integer
            error:
              type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPlanRow"
        message:
          type: string

    MaterialImportCommitResponse:
      allOf:
        - $ref: "#/components/schemas/MaterialImportResponse"
        - type: object
          required: [importBatchId, imported, created, updated, failedRows, rollback]
          properties:
            importBatchId:
              type: string
            imported:
              type: integer
              description: created + updated
            created:
              type: integer
            updated:
              type: integer
            failedRows:
              type: array
              items:
                type: object
                required: [row, action, message]
                properties:
                  row:
                    type: integer
                  action:
                    type: string
                    enum: [create, update]
                  code:
                    type: integer
                  message:
                    type: string
            rollback:
              type: object
              required: [importBatchId, created, updated, retry]
              properties:
                importBatchId:
                  type: string
                created:
                  type: string
                updated:
                  type: string
                retry:
                  type: string

    Notification:
      type: object
      required: [id, type, severity, title, message, link, read, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [import_completed, import_partial_failure]
        severity:
          type: string
          enum: [success, error]
        title:
          type: string
        message:
          type: string
        link:
          type: [string, "null"]
          description: Internal app path to the related workflow
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer

    UserProfile:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        displayName:
          type: string
        bio:
          type: string
        institution:
          type: string
        country:
          type: string
        payoutWalletAddress:
          type: string
        preferredPayoutCurrency:
          type: string
        payoutNotes:
          type: string
        createdAt:
          type: string
          format: date-time

    Purchase:
      type: object
      properties:
        _id:
          type: string
        buyerAddress:
          type: string
        materialId:
          type: string
        userEmail:
          type: string
        status:
          type: string
          enum: [pending, confirmed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Entitlement:
      type: object
      properties:
        materialId:
          type: string
        grantedAt:
          type: string
          format: date-time

    IncidentInput:
      type: object
      description: Inputs for the incident impact calculator.
      required: [incidentId, window]
      properties:
        incidentId:
          type: string
          description: Stable identifier for the incident being assessed.
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        affectedUsers:
          type: array
          description: Wallet addresses of users believed to be affected.
          items:
            type: string
        affectedRecords:
          type: array
          description: Material ids believed to be affected.
          items
            type: string
        affectedOperations:
          type: array
          description: Operation types that were disrupted.
          items:
            type: string
            enum: [purchase, import, download, entitlement]
        severity:
          type: string
          enum: [low, medium, high, critical]
        redact:
          type: boolean
          default: true
          description: When true, return the shareable view with sensitive details redacted.

    IncidentImpactSummary:
      type: object
      required: [users, records, operations, severity]
      properties:
        users:
          type: integer
        records:
          type: integer
        operations:
          type: integer
        severity:
          type: string
          enum: [low, medium, high, critical]

    IncidentImpactResult:
      type: object
      required: [incidentId, window, summary, internal, shareable]
      properties:
        incidentId:
          type: string
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          $ref: "#/components/schemas/IncidentImpactSummary"
        internal:
          type: object
          description: Full detail for maintainers. Only included when redact is false.
          properties:
            affectedUsers:
              type: array
              items
                type: string
            affectedRecords:
              type: array
              items:
                type: string
            affectedOperations:
              type: array
              items:
                type: string
        shareable:
          type: object
          description: Redacted view safe for external communication.
          required: [incidentId, window, summary]
          properties:
            incidentId:
              type: string
            window:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
            summary:
              $ref: "#/components/schemas/IncidentImpactSummary"
            note:
              type: string
              description: Human-readable explanation of the redaction.

    ReceiptPayload:
      type: object
      description: |
        Canonical, deterministic receipt payload. The `SIGNATURE_VERSION` and
        `SIGNATURE_ALGORITHM` are constants so consumers can recreate the
        canonical bytes and verify the HMAC-SHA256 signature independently.
      required:
        - receiptId
        - operation
        - actor

paths:
  /api/webhooks/{provider}:
    post:
      operationId: receiveWebhook
      summary: Receive a signed integration webhook
      description: |
        Verifies an inbound webhook from a supported provider and applies its
        side effects at most once.

        Requests must include:
        - `Xb-EduVault-Signature: v1=<hmac-sha256-hex>`
        - `Xb-EduVault-Timestamp: <unix seconds>`
        -  `Xb-EduVault-Event-Id: <stable event id>`

        The signature is computed over the canonical string
        `<timestamp>.<raw request body>` using HMAC-SHA256 with the provider
        secret configured via `WEBHOOK_<provider>_SECRET`. Timestamps outside
        the configured replay window (default 300 seconds) are rejected.
        Event ids are persisted so replaying a valid event returns 200 with
        `duplicate: true` and performs no side effects.
      tags: [Webhooks]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stellar, stripe, internal]
        - name: Xb-EduVault-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^v1=[0-9a-f]{64}$'
        - name: Xb-EduVault-Timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9]{1,10}$'
        - name: Xb-EduVault-Event-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event accepted (or already processed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement
        "400":
          description: Missing or malformed signature headers or payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
        "401":
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
        "404":
          description: Unsupported provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
        "409":
          description: Event timestamp is outside the replay window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
        "500":
          description: Unexpected server error while processing the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"

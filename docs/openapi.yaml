openapi: "3.1.0"

info:
  title: EduVault API
  version: "1.0.0"
  description: |
    REST API for the EduVault decentralised learning-material marketplace.
    All write endpoints require a valid `auth_token` cookie issued by the
    `/api/auth` login flow (HS256 JWT signed with `JWT_SECRET`).

    Inbound webhooks and integration callbacks are verified cryptographically.
    Every delivery must carry a signature header and a timestamp; events outside
    the configured replay window are rejected, and processed event IDs are
    persisted so duplicate deliveries do not repeat side effects.

servers:
  - url: "http://localhost:3000"
    description: Local development
  - url: "https://eduvault.vercel.app"
    description: Production (Vercel)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  parameters:
    WebhookSignature:
      name: X-EduVault-Signature
      in: header
      required: true
      description: |
        HMAC-SHA256 signature over the canonical payload
        `${timestamp}.${rawBody}` expressed as `sha256=<hex=`.
        The signing key is the per-provider secret configured in
        `WEBHOOK_SECRETS<` (e.g. `WEBHOOK_SECRET_INTERNAL`).
      schema:
        type: string
        pattern: '^sha256=[0-9a-f]{64}$'
    WebhookTimestamp:
      name: X-EduVault-Timestamp
      in: header
      required: true
      description: |
        Unix epoch timestamp in seconds when the delivery was signed.
        Deliveries outside the replay window (default 300 seconds) are rejected.
      schema:
        type: integer
        format: int64
        minimum: 0
    WebhookEventId:
      name: X-EduVault-Event-Id
      in: header
      required: true
      description: |
        Unique identifier for the event. Persisted on first successful processing;
        repeated deliveries return `200` with `duplicate: true` and no side effects.
      schema:
        type: string
        minLength: 1
        maxLength: 256

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
      required: [error]

    WebhookError:
      type: object
      description: Structured error returned by the webhook endpoint.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - invalid_signature
            - stale_timestamp
            - duplicate_event
            - malformed_event
            - unsupported_provider
        details:
          type: object
          additionalProperties: true

    WebhookAcknowledgement:
      type: object
      required: [status, eventId, duplicate]
      properties:
        status:
          type: string
          enum: [processed, duplicate]
        eventId:
          type: string
        duplicate:
          type: boolean
          description: True when the event was already processed and side effects were skipped.
        processedAt:
          type: string
          format: date-time
        provider:
          type: string

    Material:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
        userAddress:
          type: string
          description: Stellar public key of the uploader
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [title, price]

    MaterialInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
      required: [title, price]

    MaterialImportRecord:
      type: object
      required: [title, storageKey]
      properties:
        externalId:
          type: string
          maxLength: 128
          description: Stable id from the source system. Re-importing a row with the same externalId updates or skips instead of duplicating.
        title:
          type: string
        storageKey:
          type: string
        description:
          type: string
        shortSummary:
          type: string
        price:
          type: number
        visibility:
          type: string
          enum: [private, public, unlisted]
        category:
          type: string
        subject:
          type: string
        level:
          type: string
        usageRights:
          type: string
        coverImageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        learningOutcomes:
          type: array
          items:
            type: string
        tableOfContents:
          type: array
          items:
            type: string
        sampleNotes:
          type: array
          items:
            type: string

    ImportRowError:
      type: object
      required: [row, errors]
      properties:
        row:
          type: integer
          description: 1-based position in the submitted records array
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    ImportPlanRow:
      type: object
      required: [row, action]
      properties:
        row:
          type: integer
        action:
          type: string
          enum: [create, update, skip, error]
        externalId:
          type: [string, "null"]
        materialId:
          type: string
        fields:
          type: array
          description: Fields an update would change
          items:
            type: string
        reason:
          type: string
        errors:
          type: array
          items:
            type: object

    MaterialImportResponse:
      type: object
      required: [dryRun, total, valid, invalid, invalidRows, summary, rows]
      properties:
        dryRun:
          type: boolean
        total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        invalidRows:
          type: array
          items:
            $ref: "#components/schemas/ImportRowError"
        summary:
          type: object
          required: [create, update, skip, error]
          properties:
            create:
              type: integer
            update:
              type: integer
            skip:
              type: integer
            error:
              type: integer
        rows:
          type: array
          items:
            $ref: "#components/schemas/ImportPlanRow"
        message:
          type: string

    MaterialImportCommitResponse:
      allOf:
        - $ref: "#components/schemas/MaterialImportResponse"
        - type: object
          required: [importBatchId, imported, created, updated, failedRows, rollback]
          properties:
            importBatchId:
              type: string
            imported:
              type: integer
              description: created + updated
            created:
              type: integer
            updated:
              type: integer
            failedRows:
              type: array
              items:
                type: object
                required: [row, action, message]
                properties:
                  row:
                    type: integer
                  action:
                    type: string
                    enum: [create, update]
                  code:
                    type: integer
                  message:
                    type: string
            rollback:
              type: object
              required: [importBatchId, created, updated, retry]
              properties:
                importBatchId:
                  type: string
                created:
                  type: string
                updated:
                  type: string
                retry:
                  type: string

    Notification:
      type: object
      required: [id, type, severity, title, message, link, read, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [import_completed, import_partial_failure]
        severity:
          type: string
          enum: [success, error]
        title:
          type: string
        message:
          type: string
        link:
          type: [string, "null"]
          description: Internal app path to the related workflow
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#components/schemas/Notification"
        unreadCount:
          type: integer

    UserProfile:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        displayName:
          type: string
        bio:
          type: string
        institution:
          type: string
        country:
          type: string
        payoutWalletAddress:
          type: string
        preferredPayoutCurrency:
          type: string
        payoutNotes:
          type: string
        createdAt:
          type: string
          format: date-time

    Purchase:
      type: object
      properties:
        _id:
          type: string
        buyerAddress:
          type: string
        materialId:
          type: string
        userEmail:
          type: string
        status:
          type: string
          enum: [pending, confirmed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Entitlement:
      type: object
      properties:
        materialId:
          type: string
        grantedAt:
          type: string
          format: date-time

    IncidentInput:
      type: object
      description: Inputs for the incident impact calculator.
      required: [incidentId, window]
      properties:
        incidentId:
          type: string
          description: Stable identifier for the incident being assessed.
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        affectedUsers:
          type: array
          description: Wallet addresses of users believed to be affected.
          items:
            type: string
        affectedRecords:
          type: array
          description: Material ids believed to be affected.
          items:
            type: string
        affectedOperations:
          type: array
          description: Operation types that were disrupted.
          items:
            type: string
            enum: [purchase, import, download, entitlement]
        severity:
          type: string
          enum: [low, medium, high, critical]
        redact:
          type: boolean
          default: true
          description: When true, return the shareable view with sensitive details redacted.

    IncidentImpactSummary:
      type: object
      required: [users, records, operations, severity]
      properties:
        users:
          type: integer
        records:
          type: integer
        operations:
          type: integer
        severity:
          type: string
          enum: [low, medium, high, critical]

    IncidentImpactResult:
      type: object
      required: [incidentId, window, summary, internal, shareable]
      properties:
        incidentId:
          type: string
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          $ref: "#components/schemas/IncidentImpactSummary"
        internal:
          type: object
          description: Full detail for maintainers. Only included when redact is false.
          properties:
            affectedUsers:
              type: array
              items:
                type: string
            affectedRecords:
              type: array
              items:
                type: string
            affectedOperations:
              type: array
              items:
                type: string
        shareable:
          type: object
          description: Redacted view safe for external communication.
          required: [incidentId, window, summary]
          properties:
            incidentId:
              type: string
            window:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
            summary:
              $ref: "#components/schemas/IncidentImpactSummary"
            note:
              type: string
              description: Human-readable explanation of the redaction.

    ReceiptPayload:
      type: object
      description: |
        Canonical, deterministic receipt payload. The `SICNATURE_VERSION` and
        `SIGNATURE_ALGORITHM` are constants so consumers can recreate the
        canonical bytes and verify the HMAC-SHA256 signature independently.
      required:
        - receiptId
        - operation
        - actor
        - signatureVersion
        - signatureAlgorithm
      properties:
        receiptId:
          type: string
        operation:
          type: string
        actor:
          type: string
        signatureVersion:
          type: string
        signatureAlgorithm:
          type: string
          enum: [HMAC-SHA256]

paths:
  /api/webhooks/{provider}:
    post:
      tags: [Webhooks]
      summary: Receive a signed inbound webhook
      description: |
        Verifies the HMAC-SHA256 signature over `${timestamp}.${rawBody}`,
        enforces the replay window, and deduplicates by event ID. Invalid
        signatures return `401`, stale timestamps and malformed payloads return
        `400`, and duplicate valid events return `200` with `duplicate: true`
        without repeating side effects.
      operationId: receiveWebhook
      parameters:
        - name: provider
          in: path
          required: true
          description: Webhook provider identifier (e.g. `internal`).
          schema:
            type: string
            enum: [internal]
        - $ref: "#components/parameters/WebhookSignature"
        - $ref: "#components/parameters/WebhookTimestamp"
        - $ref: "#components/parameters/WebhookEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  description: Event type handled by the provider adapter.
                data:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Event accepted (or already processed).
          content:
            application/json:
              schema:
                $ref: "#components/schemas/WebhookAcknowledgement"
        "400":
          description: Malformed payload, missing headers, or stale timestamp.
          content:
            application/json:
              schema:
                $ref: "#components/schemas/WebhookError"
        "401":
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#components/schemas/WebhookError"
        "404":
          description: Unsupported webhook provider.
          content:
            application/json:
              schema:
                $ref: "#components/schemas/WebhookError"
        "409":
          description: Event ID already processed with a different payload digest.
          content:
            application/json:
              schema:
                $ref: "#components/schemas/WebhookError"
